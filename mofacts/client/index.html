<template name="managementRouteError">
  <section class="management-route-frame management-route-frame-error" role="alert">
    <div class="alert alert-danger">
      <h2 class="h5">{{appShellTitle}}</h2>
      <p>{{managementRouteErrorMessage}}</p>
      {{#if managementRouteCanRetry}}
        <button type="button" class="btn btn-outline-danger" data-management-route-retry="true">
          {{t 'common.tryAgain'}}
        </button>
      {{/if}}
    </div>
  </section>
</template>

<template name="DefaultLayout">
  <div class="theme-bootstrap {{themeBootstrapClass}}">
  <!-- Global Loading Spinner - Persists across route transitions for elegant UX -->
  {{#if appLoading}}
  <div class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background-color: var(--app-loading-overlay-color, rgba(245,245,245,0.95)); z-index: 10000; transition: opacity var(--app-transition-smooth, 200ms) ease-in-out;">
    <div class="text-center">
      <div class="spinner-border" role="status" style="width: calc(3rem * var(--app-density-scale)); height: calc(3rem * var(--app-density-scale)); color: var(--app-text-color);">
        <span class="sr-only">{{t 'common.loading'}}</span>
      </div>
      <div class="app-loading-message" style="color: var(--app-text-color);">{{appLoadingMessage}}</div>
    </div>
  </div>
  {{/if}}

  {{#if showAuthenticatedAppChrome}}
    <div class="app home-app {{appChromeClass}} page-loaded" id="homeContainer" style="{{appShellUnderlayStyle}}">
      {{> appSidebar}}
      <div class="main {{appMainClass}}" id="homeMain">
        <header class="top-header {{appHeaderClass}}">
          <button class="icon-btn mobile-sidebar-trigger" id="mobileSidebarToggle" type="button" aria-label="{{t 'common.openMenu'}}" title="{{t 'common.openMenu'}}">
            <span class="header-action-icon header-action-icon-sidebar" aria-hidden="true"></span>
          </button>
          <h1 class="page-title">{{appShellTitle}}</h1>
          <div class="header-right">
            {{#if isPracticeChrome}}
              <button type="button" class="btn btn-primary practice-return-button" id="saveReturnPracticeMenuButton">
                {{t 'practice.saveReturnToPracticeMenu'}}
              </button>
            {{else}}
              {{> appAccountMenu}}
            {{/if}}
          </div>
        </header>

        {{> appPracticeMenu}}

        {{#if showPageNumbers}}
          {{> curPageNumbers}}
        {{/if}}

        <main class="content {{appContentClass}}">
          {{#if uiMessage}}
          <div class="container app-ui-message-container">
            <div class="alert alert-{{uiMessage.variant}} d-flex align-items-center justify-content-between" role="alert">
              <div>{{uiMessage.text}}</div>
              <button type="button" class="btn-close" aria-label="{{t 'common.close'}}" data-ui-message-clear="true"></button>
            </div>
          </div>
          {{/if}}
          <div class="app-page-root container">
            {{#if currentTemplate}}
              {{> Template.dynamic template=currentTemplate}}
            {{else}}
              {{#if main}}
                {{> Template.dynamic template=main}}
              {{/if}}
              {{#if content}}
                {{> Template.dynamic template=content}}
              {{/if}}
              {{#if yield}}
                {{> Template.dynamic template=yield}}
              {{else}}
                {{> yield}}
              {{/if}}
            {{/if}}
          </div>
          {{#if showAppFooter}}
            {{> footer}}
          {{/if}}
        </main>
      </div>
    </div>
  {{else}}
    {{#if uiMessage}}
    <div class="container app-ui-message-container">
      <div class="alert alert-{{uiMessage.variant}} d-flex align-items-center justify-content-between" role="alert">
        <div>{{uiMessage.text}}</div>
        <button type="button" class="btn-close" aria-label="{{t 'common.close'}}" data-ui-message-clear="true"></button>
      </div>
    </div>
    {{/if}}
    <!-- main page content -->
    {{#if currentTemplate}}
      {{> Template.dynamic template=currentTemplate}}
    {{else}}
      {{#if main}}
        {{> Template.dynamic template=main}}
      {{/if}}
      {{#if content}}
        {{> Template.dynamic template=content}}
      {{/if}}
      {{#if yield}}
        {{> Template.dynamic template=yield}}
      {{else}}
        {{> yield}}
      {{/if}}
    {{/if}}
  {{/if}}
