<!-- Theme Settings Template -->

<template name="theme">
    {{#if isInRole 'admin'}}
        <div class="theme-settings-container">
            {{#if themeLoading}}
                <section class="theme-loading-placeholder admin-async-region" role="status" aria-live="polite" aria-busy="true">
                    <span>{{themeText 'common.loading'}}</span>
                </section>
            {{else}}
                {{#if themeLoadError}}
                    {{> adminStatus variant="error" text=themeLoadError urgent=true}}
                    <button type="button" class="btn btn-outline-secondary admin-form-row-sm" data-theme-retry="true">{{themeText 'common.tryAgain'}}</button>
                {{else}}
            <div class="admin-section">
                <div class="card admin-card">
                    <div class="card-body">
                        <div class="theme-library-header">
                            <div>
                                <h5>{{themeText 'theme.library'}}</h5>
                                <div class="text-muted small">
                                    {{themeText 'theme.activeServerTheme' theme=currentTheme.properties.themeName}} {{#if currentTheme.metadata.name}}<span class="text-muted">({{currentTheme.metadata.name}})</span>{{/if}}
                                </div>
                            </div>
                            <div class="theme-action-row">
                                <button type="button" id="exportActiveTheme" class="btn btn-secondary">{{themeText 'theme.exportActiveTheme'}}</button>
                                <button type="button" id="themeResetButton" class="btn">{{themeText 'theme.resetDefaultTheme'}}</button>
                            </div>
                        </div>

                        <div class="theme-library-list">
                            {{#if hasThemeLibrary}}
                                {{#each availableThemes}}
                                    <div class="theme-pill border rounded {{themePillModifier id}}">
                                        <div>
                                            <div class="fw-semibold">{{metadata.name}}</div>
                                            <span class="badge bg-light text-dark theme-origin-badge">{{themeOrigin metadata.origin}}</span>
                                        </div>
                                        <div class="btn-group btn-group-sm flex-wrap">
                                            <button type="button" class="btn set-active-theme {{themeActivateButtonClass id}}" data-id="{{id}}" {{themeActivationAttrs id}} {{themeRowCommandAttrs id}}>{{themeActivateButtonLabel id}}</button>
                                            <button type="button" class="btn btn-secondary duplicate-theme" data-id="{{id}}" data-name="{{metadata.name}}" {{themeRowCommandAttrs id}}>{{themeText 'theme.duplicate'}}</button>
                                            {{#unless (isSystemTheme metadata.origin)}}
                                                <button type="button" class="btn btn-secondary rename-theme" data-id="{{id}}" data-name="{{metadata.name}}" {{themeRowCommandAttrs id}}>{{themeText 'theme.rename'}}</button>
                                                <button type="button" class="btn btn-secondary delete-theme" data-id="{{id}}" data-name="{{metadata.name}}" {{themeRowCommandAttrs id}}>{{themeText 'theme.delete'}}</button>
                                            {{/unless}}
                                            <button type="button" class="btn btn-secondary export-theme" data-id="{{id}}" data-name="{{metadata.name}}" {{themeRowCommandAttrs id}}>{{themeText 'theme.export'}}</button>
                                        </div>
                                        {{#with (themeMessage (themeScope id))}}{{> adminStatus variant=level text=text}}{{/with}}
                                        {{> adminInlineConfirmation confirmation=(themeConfirmationFor (themeScope id))}}
                                    </div>
                                {{/each}}
                            {{else}}
                                <div class="admin-status admin-empty-text">
                                    <i class="fa fa-info-circle"></i>
                                    <div class="admin-status-text">{{themeText 'theme.noThemesRegistered'}}</div>
                                </div>
                            {{/if}}
                        </div>

                        <div class="theme-import-row border-top">
                            <span class="text-muted">{{themeText 'theme.importThemeJson'}}</span>
                            <input type="file" class="form-control theme-import-input" id="themeImportInput" accept=".json,application/json" aria-label="{{themeText 'theme.importThemeJson'}}">
                            <button type="button" class="btn" id="themeImportButton">{{themeText 'theme.import'}}</button>
                        </div>
                        {{#with (themeMessage 'library')}}{{> adminStatus variant=level text=text}}{{/with}}

                        {{> themeGenerationWizard}}
                    </div>
                </div>

                <div class="row theme-name-row align-items-center">
                    <div class="col-auto">
                        <label for="themeName" class="form-label admin-empty-text">{{themeText 'theme.themeNameLabel'}}</label>
                    </div>
                    <div class="col-auto">
                        <input type="text" id="themeName" class="currentThemeProp form-control theme-name-input" value="{{currentTheme.properties.themeName}}" data-id="themeName">
                    </div>
                </div>
                {{#with (themeMessage 'property')}}{{> adminStatus variant=level text=text}}{{/with}}

                <!-- Main Layout & Text -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.mainLayoutText'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.pageBackgroundColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_background_color}}" data-id="app_background_color" aria-label="{{themeText 'theme.pageBackgroundColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_background_color"}}" data-id="app_background_color" aria-label="{{themeText 'theme.pageBackgroundColor'}}">
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.bodyTextColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_text_color}}" data-id="app_text_color" aria-label="{{themeText 'theme.bodyTextColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_text_color"}}" data-id="app_text_color" aria-label="{{themeText 'theme.bodyTextColor'}}">
                            {{#with (getContrastInfo "app_text_color" "app_background_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.pageHeaderTextColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_page_header_text_color}}" data-id="app_page_header_text_color" aria-label="{{themeText 'theme.pageHeaderTextColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_page_header_text_color"}}" data-id="app_page_header_text_color" aria-label="{{themeText 'theme.pageHeaderTextColor'}}">
                            {{#with (getContrastInfo "app_page_header_text_color" "app_background_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.bodyFontFamily'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_font_family}}" data-id="app_font_family" placeholder="&quot;Atkinson Hyperlegible&quot;, &quot;Segoe UI&quot;, sans-serif" aria-label="{{themeText 'theme.bodyFontFamily'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.bodyFontFamilyHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.headingBrandFontFamily'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_heading_font_family}}" data-id="app_heading_font_family" placeholder="Fraunces, Georgia, serif" aria-label="{{themeText 'theme.headingBrandFontFamily'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.headingBrandFontFamilyHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.webFontStylesheetUrl'}}
                        </div>
                        <div class="col">
                            <input type="url" class="currentThemeProp form-control" value="{{currentTheme.properties.app_font_stylesheet_url}}" data-id="app_font_stylesheet_url" placeholder="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Fraunces:wght@700;800&amp;display=swap" aria-label="{{themeText 'theme.webFontStylesheetUrl'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.webFontStylesheetUrlHelp'}}
                            </small>
                            {{#if themeFontLoadError}}
                                {{> adminStatus variant="error" text=themeFontLoadError urgent=true}}
                            {{/if}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.baseFontSize'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_font_size_base}}" data-id="app_font_size_base" placeholder="16px" aria-label="{{themeText 'theme.baseFontSize'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.baseFontSizeHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.spacingDensityScale'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{currentTheme.properties.app_density_scale}}" data-id="app_density_scale" min="0.5" max="2" step="0.05" placeholder="1" aria-label="{{themeText 'theme.spacingDensityScale'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.spacingDensityScaleHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.navigationHeaderBackground'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.navigation_surface_color}}" data-id="navigation_surface_color" aria-label="{{themeText 'theme.navigationHeaderBackground'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "navigation_surface_color"}}" data-id="navigation_surface_color" aria-label="{{themeText 'theme.navigationHeaderBackground'}}">
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.navigationHeaderTextColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.navigation_text_color}}" data-id="navigation_text_color" aria-label="{{themeText 'theme.navigationHeaderTextColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "navigation_text_color"}}" data-id="navigation_text_color" aria-label="{{themeText 'theme.navigationHeaderTextColor'}}">
                            {{#with (getContrastInfo "navigation_text_color" "navigation_surface_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.cardBackgroundColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_surface_color}}" data-id="learning_card_surface_color" aria-label="{{themeText 'theme.cardBackgroundColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_surface_color"}}" data-id="learning_card_surface_color" aria-label="{{themeText 'theme.cardBackgroundColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.cardBackgroundColorHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.stimulusBoxBackground'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_stimulus_surface_color}}" data-id="learning_card_stimulus_surface_color" aria-label="{{themeText 'theme.stimulusBoxBackground'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_stimulus_surface_color"}}" data-id="learning_card_stimulus_surface_color" aria-label="{{themeText 'theme.stimulusBoxBackground'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.stimulusBoxBackgroundHelp'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Buttons & Interactive -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.buttonsInteractiveElements'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.defaultButtonBackground'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_primary_action_surface_color}}" data-id="app_primary_action_surface_color" aria-label="{{themeText 'theme.defaultButtonBackground'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_primary_action_surface_color"}}" data-id="app_primary_action_surface_color" aria-label="{{themeText 'theme.defaultButtonBackground'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.defaultButtonBackgroundHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.defaultButtonTextColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_primary_action_text_color}}" data-id="app_primary_action_text_color" aria-label="{{themeText 'theme.defaultButtonTextColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_primary_action_text_color"}}" data-id="app_primary_action_text_color" aria-label="{{themeText 'theme.defaultButtonTextColor'}}">
                            {{#with (getContrastInfo "app_primary_action_text_color" "app_primary_action_surface_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.practiceButtonBackground'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_primary_action_surface_color}}" data-id="learning_card_primary_action_surface_color" aria-label="{{themeText 'theme.practiceButtonBackground'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_primary_action_surface_color"}}" data-id="learning_card_primary_action_surface_color" aria-label="{{themeText 'theme.practiceButtonBackground'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.practiceButtonBackgroundHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.practiceButtonTextColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_primary_action_text_color}}" data-id="learning_card_primary_action_text_color" aria-label="{{themeText 'theme.practiceButtonTextColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_primary_action_text_color"}}" data-id="learning_card_primary_action_text_color" aria-label="{{themeText 'theme.practiceButtonTextColor'}}">
                            {{#with (getContrastInfo "learning_card_primary_action_text_color" "learning_card_primary_action_surface_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.accentColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_accent_color}}" data-id="app_accent_color" aria-label="{{themeText 'theme.accentColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_accent_color"}}" data-id="app_accent_color" aria-label="{{themeText 'theme.accentColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.accentColorHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.practiceMenuAccuracyBarFill'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.practice_menu_accuracy_bar_fill_color}}" data-id="practice_menu_accuracy_bar_fill_color" aria-label="{{themeText 'theme.practiceMenuAccuracyBarFill'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "practice_menu_accuracy_bar_fill_color"}}" data-id="practice_menu_accuracy_bar_fill_color" aria-label="{{themeText 'theme.practiceMenuAccuracyBarFill'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.practiceMenuAccuracyBarFillHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.practiceMenuAccuracyBarTrack'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.practice_menu_accuracy_bar_track_color}}" data-id="practice_menu_accuracy_bar_track_color" aria-label="{{themeText 'theme.practiceMenuAccuracyBarTrack'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.practiceMenuAccuracyBarTrackHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.buttonHeight'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_button_height}}" data-id="app_button_height" placeholder="44px" aria-label="{{themeText 'theme.buttonHeight'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='44px'}}</strong> - {{themeText 'theme.sharedMinimumButtonHeight'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.textInputHeight'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_text_input_height}}" data-id="app_text_input_height" placeholder="36px" aria-label="{{themeText 'theme.textInputHeight'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='36px'}}</strong> - {{themeText 'theme.sharedMinimumTextInputHeight'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.buttonBorderDarkness'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{currentTheme.properties.app_button_border_darkness}}" data-id="app_button_border_darkness" min="0" max="50" step="5" placeholder="20" aria-label="{{themeText 'theme.buttonBorderDarkness'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='20%'}}</strong> - {{themeText 'theme.buttonBorderDarknessHelp'}}<br>
                                <em>{{themeText 'theme.rangeLabel'}}</em> {{themeText 'theme.buttonDarknessRange'}}<br>
                                <em>{{themeText 'theme.appliesToLabel'}}</em> {{themeText 'theme.buttonBorderDarknessAppliesTo'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.buttonHoverDarkness'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{currentTheme.properties.app_button_hover_darkness}}" data-id="app_button_hover_darkness" min="0" max="50" step="5" placeholder="15" aria-label="{{themeText 'theme.buttonHoverDarkness'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='15%'}}</strong> - {{themeText 'theme.buttonHoverDarknessHelp'}}<br>
                                <em>{{themeText 'theme.rangeLabel'}}</em> {{themeText 'theme.buttonHoverDarknessRange'}}<br>
                                <em>{{themeText 'theme.appliesToLabel'}}</em> {{themeText 'theme.buttonHoverDarknessAppliesTo'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Menus & Secondary -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.menusSecondaryElements'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.secondaryBackground'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_secondary_surface_color}}" data-id="app_secondary_surface_color" aria-label="{{themeText 'theme.secondaryBackground'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_secondary_surface_color"}}" data-id="app_secondary_surface_color" aria-label="{{themeText 'theme.secondaryBackground'}}">
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.secondaryText'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_secondary_text_color}}" data-id="app_secondary_text_color" aria-label="{{themeText 'theme.secondaryText'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "app_secondary_text_color"}}" data-id="app_secondary_text_color" aria-label="{{themeText 'theme.secondaryText'}}">
                            {{#with (getContrastInfo "app_secondary_text_color" "app_secondary_surface_color")}}
                                <small class="form-text {{#unless passes}}text-warning{{/unless}}">
                                    {{themeText 'theme.contrastLabel'}} <strong>{{ratio}}:1</strong>
                                    <span class="badge bg-{{badgeClass}}">{{#if passes}}✓{{else}}⚠{{/if}} WCAG {{level}}</span>
                                </small>
                            {{/with}}
                        </div>
                    </div>
                </div>

                <!-- Alerts & Feedback -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.alertsFeedback'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.successColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.feedback_correct_color}}" data-id="feedback_correct_color" aria-label="{{themeText 'theme.successColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "feedback_correct_color"}}" data-id="feedback_correct_color" aria-label="{{themeText 'theme.successColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.successColorHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.alertColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.feedback_error_color}}" data-id="feedback_error_color" aria-label="{{themeText 'theme.alertColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "feedback_error_color"}}" data-id="feedback_error_color" aria-label="{{themeText 'theme.alertColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.alertColorHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.audioIconColorDisabled'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_audio_icon_disabled_color}}" data-id="learning_card_audio_icon_disabled_color" aria-label="{{themeText 'theme.audioIconColorDisabled'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_audio_icon_disabled_color"}}" data-id="learning_card_audio_icon_disabled_color" aria-label="{{themeText 'theme.audioIconColorDisabled'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.audioIconColorDisabledHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.audioControlColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_audio_control_color}}" data-id="learning_card_audio_control_color" aria-label="{{themeText 'theme.audioControlColor'}}">
                            <input type="color" class="currentThemePropColor" value="{{themeColorPickerValue "learning_card_audio_control_color"}}" data-id="learning_card_audio_control_color" aria-label="{{themeText 'theme.audioControlColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.audioControlColorHelp'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Card Surfaces & Overlays -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.cardSurfacesOverlays'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.videoOverlaySurface'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.media_video_overlay_surface_color}}" data-id="media_video_overlay_surface_color" placeholder="rgba(255, 255, 255, 0.98)" aria-label="{{themeText 'theme.videoOverlaySurface'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.videoOverlaySurfaceHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.videoOverlayBackdrop'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.media_video_overlay_backdrop_color}}" data-id="media_video_overlay_backdrop_color" placeholder="rgba(0, 0, 0, 0.6)" aria-label="{{themeText 'theme.videoOverlayBackdrop'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.videoOverlayBackdropHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.surfaceShadow'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_surface_shadow}}" data-id="app_surface_shadow" placeholder="0 4px 12px rgba(0, 0, 0, 0.18)" aria-label="{{themeText 'theme.surfaceShadow'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.surfaceShadowHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.performanceDividerColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.learning_card_performance_divider_color}}" data-id="learning_card_performance_divider_color" placeholder="rgba(15, 23, 42, 0.15)" aria-label="{{themeText 'theme.performanceDividerColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.performanceDividerColorHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.loadingOverlayColor'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_loading_overlay_color}}" data-id="app_loading_overlay_color" placeholder="rgba(245, 245, 245, 0.95)" aria-label="{{themeText 'theme.loadingOverlayColor'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.loadingOverlayColorHelp'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Border Radius & Layout -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.borderRadiusCorners'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.smallBorderRadius'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_border_radius_sm}}" data-id="app_border_radius_sm" placeholder="8px" aria-label="{{themeText 'theme.smallBorderRadius'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='8px'}}</strong> - {{themeText 'theme.smallUiElements'}}<br>
                                <em>{{themeText 'theme.usedForLabel'}}</em> {{themeText 'theme.smallRadiusUsedFor'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.largeBorderRadius'}}
                        </div>
                        <div class="col">
                            <input type="text" class="currentThemeProp form-control" value="{{currentTheme.properties.app_border_radius_lg}}" data-id="app_border_radius_lg" placeholder="12px" aria-label="{{themeText 'theme.largeBorderRadius'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='12px'}}</strong> - {{themeText 'theme.largeContainers'}}<br>
                                <em>{{themeText 'theme.usedForLabel'}}</em> {{themeText 'theme.largeRadiusUsedFor'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Animation -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.animationSpeeds'}}</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.transitionSpeedInstant'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{themeEditorValue 'app_transition_instant'}}" data-id="app_transition_instant" min="0" max="500" step="10" placeholder="10" aria-label="{{themeText 'theme.transitionSpeedInstant'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='10ms'}}</strong> - {{themeText 'theme.transitionInstantHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.transitionSpeedFast'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{themeEditorValue 'app_transition_fast'}}" data-id="app_transition_fast" min="0" max="500" step="10" placeholder="100" aria-label="{{themeText 'theme.transitionSpeedFast'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='100ms'}}</strong> - {{themeText 'theme.quickTransitions'}}<br>
                                <em>{{themeText 'theme.usedForLabel'}}</em> {{themeText 'theme.fastTransitionUsedFor'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.transitionSpeedSmooth'}}
                        </div>
                        <div class="col">
                            <input type="number" class="currentThemeProp form-control" value="{{themeEditorValue 'app_transition_smooth'}}" data-id="app_transition_smooth" min="0" max="1000" step="50" placeholder="200" aria-label="{{themeText 'theme.transitionSpeedSmooth'}}">
                            <small class="form-text text-muted">
                                <strong>{{themeText 'theme.defaultValue' value='200ms'}}</strong> - {{themeText 'theme.mainContentTransitions'}}<br>
                                <em>{{themeText 'theme.usedForLabel'}}</em> {{themeText 'theme.smoothTransitionUsedFor'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Deployment branding and public landing page -->
                <div class="theme-section">
                    <h5 class="theme-section-header">Branding and Landing Page</h5>
                    <p class="text-muted">This deployment-wide identity is independent of visual themes. Changes remain private until the complete Brand Profile is published.</p>
                    {{#with brandProfileDraft}}
                    <h6>Identity</h6>
                    <div class="row row-cols-2">
                        <div class="col text-end">Product name</div><div class="col"><input class="form-control" data-brand-identity="name" value="{{identity.name}}"></div>
                        <div class="col text-end">Short name</div><div class="col"><input class="form-control" data-brand-identity="shortName" value="{{identity.shortName}}" maxlength="24"></div>
                        <div class="col text-end">Organization</div><div class="col"><input class="form-control" data-brand-identity="organizationName" value="{{identity.organizationName}}"></div>
                        <div class="col text-end">Logo</div><div class="col"><input class="form-control" type="file" accept="image/png" data-brand-image-upload="logo"><input class="form-control admin-form-row-top" data-brand-identity="logoUrl" value="{{identity.logoUrl}}"></div>
                        <div class="col text-end">16px favicon URL</div><div class="col"><input class="form-control" data-brand-identity="favicon16Url" value="{{identity.favicon16Url}}"></div>
                        <div class="col text-end">32px favicon URL</div><div class="col"><input class="form-control" data-brand-identity="favicon32Url" value="{{identity.favicon32Url}}"></div>
                        <div class="col text-end">Apple touch icon URL</div><div class="col"><input class="form-control" data-brand-identity="appleTouchIconUrl" value="{{identity.appleTouchIconUrl}}"></div>
                        <div class="col text-end">Android 192px icon URL</div><div class="col"><input class="form-control" data-brand-identity="androidIcon192Url" value="{{identity.androidIcon192Url}}"></div>
                        <div class="col text-end">Android 512px icon URL</div><div class="col"><input class="form-control" data-brand-identity="androidIcon512Url" value="{{identity.androidIcon512Url}}"></div>
                        <div class="col text-end">Maskable 192px icon URL</div><div class="col"><input class="form-control" data-brand-identity="androidMaskableIcon192Url" value="{{identity.androidMaskableIcon192Url}}"></div>
                        <div class="col text-end">Maskable 512px icon URL</div><div class="col"><input class="form-control" data-brand-identity="androidMaskableIcon512Url" value="{{identity.androidMaskableIcon512Url}}"></div>
                        <div class="col text-end">Social preview image</div><div class="col"><input class="form-control" type="file" accept="image/png" data-brand-image-upload="social"><input class="form-control admin-form-row-top" data-brand-identity="socialImageUrl" value="{{identity.socialImageUrl}}"></div>
                    </div>

                    <h6 class="admin-form-row-top">Landing layout</h6>
                    <div class="form-check"><input class="form-check-input" type="checkbox" data-brand-landing-boolean="heroEnabled" {{brandHeroEnabled}}><label class="form-check-label">Show hero section</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" data-brand-landing-boolean="audiencesEnabled" {{brandAudiencesEnabled}}><label class="form-check-label">Show audience demos section</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" data-brand-landing-boolean="showCreateAccount" {{brandShowCreateAccount}}><label class="form-check-label">Show Create account action</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" data-brand-hero-first {{brandHeroFirst}}><label class="form-check-label">Show hero before audience demos</label></div>
                    <label class="form-label admin-form-row-top">Hero image</label><input class="form-control" type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-brand-image-upload="hero"><input class="form-control admin-form-row-top" data-brand-landing-text="heroImageUrl" value="{{landing.heroImageUrl}}">
                    <label class="form-label admin-form-row-top">Hero image alternative text for selected language</label><input class="form-control" data-brand-hero-alt value="{{brandHeroAlt}}">
                    <div class="row admin-form-row-top">
                        {{#each brandAudienceRows}}
                        <div class="col-md-4">
                            <div class="form-check"><input class="form-check-input" type="checkbox" data-brand-audience-enabled="{{id}}" {{enabled}}><label class="form-check-label">Show {{label}} demo</label></div>
                            <label class="form-label">Order (0–2)</label><input class="form-control" type="number" min="0" max="2" data-brand-audience-order="{{id}}" value="{{order}}">
                        </div>
                        {{/each}}
                    </div>

                    <h6 class="admin-form-row-top">Legal destinations</h6>
                    <div class="row row-cols-2">
                        <div class="col text-end">Terms URL</div><div class="col"><input class="form-control" data-brand-legal="termsUrl" value="{{legal.termsUrl}}"></div>
                        <div class="col text-end">Privacy URL</div><div class="col"><input class="form-control" data-brand-legal="privacyUrl" value="{{legal.privacyUrl}}"></div>
                        <div class="col text-end">Support URL</div><div class="col"><input class="form-control" data-brand-legal="supportUrl" value="{{legal.supportUrl}}"></div>
                        <div class="col text-end">Software license and source URL</div><div class="col"><input class="form-control" data-brand-legal="licenseSourceUrl" value="{{legal.licenseSourceUrl}}"></div>
                    </div>

                    <h6 class="admin-form-row-top">Localized landing and identity text</h6>
                    <label class="form-label" for="brandProfileDefaultLocale">Default language for crawlers and signed-out visitors</label>
                    <select id="brandProfileDefaultLocale" class="form-select" data-brand-default-locale>
                        {{#each brandProfileDefaultLocaleOptions}}<option value="{{locale}}" selected={{selected}}>{{label}}</option>{{/each}}
                    </select>
                    <label class="form-label" for="brandProfileLocale">Language</label>
                    <select id="brandProfileLocale" class="form-select" data-brand-locale>
                        {{#each brandProfileLocaleOptions}}<option value="{{locale}}" selected={{selected}}>{{label}}</option>{{/each}}
                    </select>
                    <p class="text-muted admin-form-row-top">{{brandProfileCompleteness}}</p>
                    <div class="row row-cols-2 admin-form-row-top">
                        {{#each brandLocaleFields}}
                        <div class="col text-end"><label>{{label}}</label></div>
                        <div class="col">
                            {{#if multiline}}<textarea class="form-control" rows="3" data-brand-locale-field="{{key}}">{{value}}</textarea>{{else}}<input class="form-control" data-brand-locale-field="{{key}}" value="{{value}}">{{/if}}
                        </div>
                        {{/each}}
                    </div>

                    {{#with brandPreview}}
                    <div class="card admin-form-row-top" aria-label="Brand Profile landing preview">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-2">{{#if logoUrl}}<img src="{{logoUrl}}" alt="" style="max-height:48px;max-width:160px">{{/if}}<strong>{{name}}</strong></div>
                            {{#if heroImageUrl}}<img class="img-fluid admin-form-row-top" src="{{heroImageUrl}}" alt="{{heroImageAlt}}" style="max-height:220px">{{/if}}
                            <p class="text-muted admin-form-row-top">{{eyebrow}}</p><h3>{{title}}</h3><p>{{copy}}</p>
                        </div>
                    </div>
                    {{/with}}

                    <div class="theme-action-row admin-form-row-top">
                        <button type="button" class="btn btn-secondary" data-brand-save>Save draft</button>
                        <button type="button" class="btn btn-primary" data-brand-publish>Publish Brand Profile</button>
                        <button type="button" class="btn btn-secondary" data-brand-export>Export</button>
                        <label class="btn btn-secondary">Import draft<input type="file" accept="application/json,.json" data-brand-import hidden></label>
                    </div>
                    {{#with brandProfileMessage}}{{> adminStatus variant=level text=text}}{{/with}}
                    {{else}}
                    <p>Loading Brand Profile…</p>
                    {{/with}}
                </div>

                <!-- Theme-specific home appearance -->
                <div class="theme-section">
                    <h5 class="theme-section-header">Home appearance</h5>
                    <div class="row row-cols-2">
                        <div class="col text-end">
                            {{themeText 'theme.homePageUnderlayImage'}}
                        </div>
                        <div class="col">
                            <input type="file" class="form-control admin-form-row-sm" id="homeUnderlayUpload" accept="image/*" aria-label="{{themeText 'theme.homePageUnderlayImage'}}">
                            <input type="text" class="form-control currentThemeProp" value="{{currentTheme.properties.practice_menu_underlay_image_url}}" data-id="practice_menu_underlay_image_url" placeholder="https://example.com/underlay.jpg" aria-label="{{themeText 'theme.homePageUnderlayImage'}}">
                            <small class="form-text text-muted">
                                {{themeText 'theme.homeUnderlayHelp'}}
                            </small>
                            {{#with (themeMessage 'underlay')}}{{> adminStatus variant=level text=text}}{{/with}}
                            {{#if currentTheme.properties.practice_menu_underlay_image_url}}
                            <div class="theme-preview-stack">
                                <button type="button" id="clearHomeUnderlay" class="btn btn-secondary btn-sm">{{themeText 'theme.clearUnderlayImage'}}</button>
                                <img src="{{currentTheme.properties.practice_menu_underlay_image_url}}"
                                     alt="{{themeText 'theme.homeUnderlayPreviewAlt'}}"
                                     class="img-thumbnail theme-underlay-preview"
                                     loading="lazy"
                                     decoding="async"
                                     fetchpriority="low">
                            </div>
                            {{/if}}
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.homeWelcomeBackHtml'}}
                        </div>
                        <div class="col">
                            <textarea class="form-control currentThemeProp" rows="5" data-id="practice_menu_welcome_html" aria-label="{{themeText 'theme.homeWelcomeBackHtml'}}">{{currentTheme.properties.practice_menu_welcome_html}}</textarea>
                            <small class="form-text text-muted">
                                {{themeText 'theme.homeWelcomeBackHtmlHelp'}}
                            </small>
                        </div>
                        <div class="col text-end">
                            {{themeText 'theme.homeFirstPracticeHtml'}}
                        </div>
                        <div class="col">
                            <textarea class="form-control currentThemeProp" rows="5" data-id="practice_menu_first_practice_welcome_html" aria-label="{{themeText 'theme.homeFirstPracticeHtml'}}">{{currentTheme.properties.practice_menu_first_practice_welcome_html}}</textarea>
                            <small class="form-text text-muted">
                                {{themeText 'theme.homeFirstPracticeHtmlHelp'}}
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Custom Help Page -->
                <div class="theme-section">
                    <h5 class="theme-section-header">{{themeText 'theme.customHelpPage'}}</h5>
                    <div class="row">
                        <div class="col-12">
                            <p class="text-muted admin-form-row">
                                {{themeText 'theme.customHelpDescription'}}
                            </p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-8 offset-md-2">
                            <div class="admin-form-row">
                                <label for="helpFileUpload" class="form-label">{{themeText 'theme.chooseMarkdownFile'}}</label>
                                <input type="file" class="form-control" id="helpFileUpload" accept=".md">
                                <small class="form-text text-muted">{{themeText 'theme.maxFileSizeOneMb'}}</small>
                            </div>
                            {{#if customHelpPageEnabled}}
                            <div class="alert alert-success admin-form-row">
                                <strong>{{themeText 'theme.customHelpPageActive'}}</strong>
                                {{#if customHelpPageUploadedAt}}
                                <br>
                                <small>{{themeText 'theme.uploadedAt' uploadedAt=(formatDate customHelpPageUploadedAt)}}</small>
                                {{/if}}
                            </div>
                            {{/if}}
                            <div class="d-grid theme-action-stack">
                                <button type="button" id="uploadHelpFileButton" class="btn">
                                    {{themeText 'theme.uploadCustomHelpFile'}}
                                </button>
                                {{#if customHelpPageEnabled}}
                                <button type="button" id="removeHelpFileButton" class="btn btn-secondary">
                                    {{themeText 'theme.removeCustomHelpUseDefaultWiki'}}
                                </button>
                                {{/if}}
                            </div>
                            {{#if themeHelpStatus}}
                                {{> adminStatus variant=themeHelpStatus.level text=themeHelpStatus.text}}
                            {{/if}}
                            {{> adminInlineConfirmation confirmation=(themeConfirmationFor 'help')}}
                        </div>
                    </div>
                </div>
            </div>
                {{/if}}
            {{/if}}
        </div>
    {{/if}}
</template>
