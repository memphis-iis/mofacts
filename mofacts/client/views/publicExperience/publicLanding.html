<template name="publicLanding">
  <div class="public-theme-context public-experience-page">
    <header class="public-site-header">
      <a class="public-brand" href="/" aria-label="{{systemName}}">
        {{#if deploymentBrandProfile.identity.logoUrl}}
          <span class="public-brand-logo" aria-hidden="true" style="--public-brand-logo-image: url('{{deploymentBrandProfile.identity.logoUrl}}');"></span>
        {{/if}}
        <span><strong>{{systemName}}</strong><small>{{pt 'brandTagline'}}</small></span>
      </a>
      <nav class="public-site-nav" aria-label="{{pt 'demosTitle'}}">
        {{#each enabledAudiences}}<a href="{{hash}}" data-public-audience="{{id}}" aria-current="{{current}}">{{label}}</a>{{/each}}
      </nav>
      <div class="public-site-actions">
        {{#if showCreateAccount}}<a class="btn btn-outline-secondary" href="/auth/signup">{{pt 'createAccount'}}</a>{{/if}}
        <a class="btn btn-primary" href="/auth/login">{{pt 'signIn'}}</a>
      </div>
    </header>

    <main>
      {{#each landingSections}}
      {{#if isHeroSection id}}
      <section class="public-hero" aria-labelledby="publicHeroTitle">
        <div class="public-hero-copy">
          <p class="public-eyebrow">{{pt 'eyebrow'}}</p>
          <h1 id="publicHeroTitle">{{pt 'heroTitle'}}</h1>
          <p>{{pt 'heroCopy'}}</p>
          <div class="public-hero-actions">
            {{#if heroAudienceId}}<a class="btn btn-primary btn-lg" href="{{heroAudienceHash}}" data-public-audience="{{heroAudienceId}}">{{pt 'tryMofacts'}}</a>{{/if}}
            <a class="btn btn-outline-secondary btn-lg" href="/auth/login">{{pt 'signIn'}}</a>
          </div>
        </div>
        {{#if heroImageUrl}}
        <div class="public-hero-visual"><img src="{{heroImageUrl}}" alt="{{heroImageAlt}}"></div>
        {{else}}
        <div class="public-hero-visual" aria-hidden="true">
          <div class="public-visual-orbit public-visual-orbit-one"></div>
          <div class="public-visual-orbit public-visual-orbit-two"></div>
          <div class="public-visual-card public-visual-card-primary"><span class="fa fa-refresh"></span></div>
          <div class="public-visual-card public-visual-card-secondary"><span class="fa fa-bar-chart"></span></div>
        </div>
        {{/if}}
      </section>
      {{else}}
      <section class="public-audience-explorer" id="publicAudiences" aria-labelledby="publicAudienceTitle">
        <div class="public-audience-tabs" role="tablist" aria-label="{{pt 'demosTitle'}}">
          {{#each enabledAudiences}}
          <button type="button" role="tab" id="{{tabId}}" aria-controls="publicAudiencePanel" aria-selected="{{selected}}" tabindex="{{tabIndex}}" data-public-audience="{{id}}"><span class="fa {{icon}}" aria-hidden="true"></span>{{label}}</button>
          {{/each}}
        </div>

        <div class="public-audience-panel" id="publicAudiencePanel" role="tabpanel" aria-labelledby="{{activeAudienceTabId}}">
          <div class="public-audience-copy" aria-live="polite">
            <p class="public-eyebrow">{{activeAudienceLabel}}</p>
            <h2 id="publicAudienceTitle">{{activeAudienceTitle}}</h2>
            <p class="public-audience-lead">{{activeAudienceCopy}}</p>
            <div class="public-audience-capability">
              <span class="fa {{activeAudienceIcon}}" aria-hidden="true"></span>
              <p>{{pt 'capabilitiesCopy'}}</p>
            </div>
            <p class="public-demo-disclosure"><span>{{pt 'demoEnglish'}}</span> <span>{{pt 'demoPrivacy'}}</span></p>
            {{#if expiredMessage}}<div class="alert alert-warning public-demo-inline-message" role="status">{{expiredMessage}}</div>{{/if}}
            {{#if launchError}}<div class="alert alert-danger public-demo-inline-message" role="alert">{{launchError}}</div>{{/if}}
            <button class="btn btn-primary btn-lg" type="button" data-public-demo-start disabled="{{startDisabled}}">
              {{startLabel}} <span class="public-forward-arrow" aria-hidden="true">→</span>
            </button>
            <p class="public-demo-status" aria-live="polite">{{launchStatus}}</p>
          </div>

          <div class="public-role-preview" aria-hidden="true">
            <div class="public-role-preview-bar"><span></span><span></span><span></span><strong>{{systemName}}</strong></div>
            <div class="public-role-preview-body">
              <aside><span class="fa {{activeAudienceIcon}}"></span><i></i><i></i><i></i></aside>
              <div class="public-role-preview-content">
                <div class="public-role-preview-heading"><span></span><span></span></div>
                <div class="public-role-preview-card public-role-preview-card-primary"><span class="fa {{activeAudienceIcon}}"></span><div class="public-role-preview-lines"><i></i><i></i></div></div>
                <div class="public-role-preview-card"><span class="fa {{activePreviewSecondaryIcon}}"></span><div class="public-role-preview-lines"><i></i><i></i></div></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      {{/if}}
      {{/each}}
    </main>

    <footer class="public-site-footer">
      <span>{{footerCopyright}}</span>
      <nav aria-label="Footer"><a href="/legal">{{legalLinkLabel}}</a></nav>
    </footer>
  </div>
</template>
