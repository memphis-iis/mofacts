<template name="aiContentPromptLab">
  <div class="admin-section">
    <div class="card admin-card">
      <div class="card-body">
        <div class="admin-header-action-row">
          <div>
            <div class="admin-section-heading admin-section-heading-compact">
              <i class="fa fa-flask admin-section-icon" aria-hidden="true"></i>
              <h5>AI Content Prompt Lab</h5>
            </div>
            <div class="text-muted small">Run the complete live content workflow, inspect every data object and branch, and compare browser-local prompt checkpoints. Provider calls and results are not retained by {{systemName}}.</div>
          </div>
          {{#if pending}}
            <button type="button" class="btn btn-primary run-ai-content-prompt-lab" disabled aria-busy="true">Running...</button>
          {{else}}
            <button type="button" class="btn btn-primary run-ai-content-prompt-lab" {{runDisabled}} aria-busy="false">Run complete simulation</button>
          {{/if}}
        </div>

        <div class="alert alert-info small admin-form-row-top" role="status">{{baselineDescription}}</div>

        <label for="ai-content-prompt-lab-author-notes" class="form-label">Author notes</label>
        <textarea id="ai-content-prompt-lab-author-notes" class="form-control" rows="5" spellcheck="true">{{authorNotes}}</textarea>

        <div class="row admin-form-row-top">
          <div class="col-md-8">
            <label for="ai-content-prompt-lab-model" class="form-label">Configured model</label>
            <input id="ai-content-prompt-lab-model" class="form-control" type="text" value="{{configuredModel}}" readonly>
            <div class="form-text">Every AI stage uses the model selected in the Admin Control Panel. The model is never restored from a checkpoint.</div>
          </div>
        </div>

        <div class="admin-header-action-row admin-form-row-top">
          <div>
            <h6>Live stage prompts and execution settings</h6>
            <div class="text-muted small">Each AI stage has explicit reasoning and a visible-output budget. Lab edits stay in this browser; Creator uses the defaults stored in code. Resetting first saves the current draft as a checkpoint and retains the author notes.</div>
          </div>
          <button type="button" class="btn btn-outline-secondary reset-ai-content-prompt-lab-code-defaults" {{resetCodeDefaultsDisabled}}>Reset to code defaults</button>
        </div>
        {{#each stageRows}}
          <details class="admin-form-row-top ai-content-lab-stage-settings">
            <summary>{{number}}. {{label}} — reasoning: {{reasoningLevel}}, visible tokens: {{visibleOutputTokens}}</summary>
            <div class="mt-2">
              <label class="form-label" for="ai-content-lab-system-{{stage}}">System instructions</label>
              <textarea id="ai-content-lab-system-{{stage}}" class="form-control admin-form-monospace ai-content-lab-stage-system" data-stage="{{stage}}" rows="8" spellcheck="true">{{systemPrompt}}</textarea>

              <label class="form-label admin-form-row-top" for="ai-content-lab-instructions-{{stage}}">Stage instructions</label>
              <textarea id="ai-content-lab-instructions-{{stage}}" class="form-control admin-form-monospace ai-content-lab-stage-instructions" data-stage="{{stage}}" rows="5" spellcheck="true">{{instructions}}</textarea>

              <label class="form-label admin-form-row-top" for="ai-content-lab-schema-{{stage}}">Strict response schema preview</label>
              <textarea id="ai-content-lab-schema-{{stage}}" class="form-control admin-form-monospace" rows="10" readonly>{{schemaJson}}</textarea>

              <div class="row admin-form-row-top">
                <div class="col-md-6">
                  <label class="form-label" for="ai-content-lab-reasoning-{{stage}}">Reasoning level</label>
                  <select id="ai-content-lab-reasoning-{{stage}}" class="form-select ai-content-lab-stage-reasoning" data-stage="{{stage}}" {{reasoningDisabled}}>
                    {{#each reasoningOptions}}
                      <option value="{{value}}" {{selectedAttrs}}>{{label}}</option>
                    {{/each}}
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="ai-content-lab-tokens-{{stage}}">Visible output tokens</label>
                  <input id="ai-content-lab-tokens-{{stage}}" class="form-control ai-content-lab-stage-tokens" data-stage="{{stage}}" type="number" min="1" step="1" value="{{visibleOutputTokens}}">
                </div>
              </div>
            </div>
          </details>
        {{/each}}

        <div class="row admin-form-row-top align-items-end">
          <div class="col-md-8">
            <label for="ai-content-prompt-lab-checkpoint-label" class="form-label">Checkpoint label <span class="text-muted">(optional)</span></label>
            <input id="ai-content-prompt-lab-checkpoint-label" class="form-control" type="text" value="{{checkpointLabel}}" placeholder="For example, direct-map evaluator v3">
          </div>
          <div class="col-md-4 mt-2 mt-md-0">
            <button type="button" class="btn btn-outline-secondary save-ai-content-prompt-lab-checkpoint">Save checkpoint</button>
          </div>
        </div>

        <details class="admin-form-row-top">
          <summary>Saved checkpoints ({{checkpointCount}})</summary>
          {{#if hasCheckpoints}}
            <div class="table-responsive mt-2">
              <table class="table table-sm">
                <thead><tr><th scope="col">Checkpoint</th><th scope="col">Saved</th><th scope="col">Snapshot</th><th scope="col"></th></tr></thead>
                <tbody>
                  {{#each checkpointRows}}
                    <tr>
                      <td>{{label}}</td>
                      <td>{{savedAtDisplay}}</td>
                      <td>
                        <details>
                          <summary>View settings</summary>
                          <textarea class="form-control admin-form-monospace mt-2" rows="14" readonly>{{settingsJson}}</textarea>
                        </details>
                      </td>
                      <td><button type="button" class="btn btn-sm btn-outline-primary load-ai-content-prompt-lab-checkpoint" data-checkpoint-id="{{id}}">Load</button></td>
                    </tr>
                  {{/each}}
                </tbody>
              </table>
            </div>
          {{else}}
            <div class="text-muted small mt-2">No checkpoints saved yet.</div>
          {{/if}}
        </details>

        {{#if error}}
          <label for="ai-content-prompt-lab-error" class="form-label admin-form-row-top">Complete error details</label>
          <textarea id="ai-content-prompt-lab-error" class="form-control admin-form-monospace is-invalid" rows="10" readonly>{{error}}</textarea>
        {{/if}}

        {{#if hasRun}}
          <section class="admin-form-row-top" aria-labelledby="ai-content-lab-trace-title">
            <h6 id="ai-content-lab-trace-title">Pipeline data objects and calls</h6>
            <div class="text-muted small">The trace records structured inputs, retrieved candidates, supplied IDs, decisions, effective model and reasoning, API outputs, branches, filename-pattern predictions, canonical Wikimedia resolutions, and failures. Retrieved page HTML is summarized by character count so it does not overwhelm the browser.</div>
            {{#each traceRows}}
              <details class="admin-form-row-top ai-content-lab-trace">
                <summary>{{number}}. {{stageLabel}} — {{status}}{{#if itemLabel}} — {{itemLabel}}{{/if}}</summary>
                <div class="text-muted small mt-2">{{description}}</div>
                {{#if retryable}}
                  <button type="button" class="btn btn-sm btn-outline-primary mt-2 retry-ai-content-prompt-stage" data-trace-id="{{traceId}}">Retry from this recorded stage</button>
                {{/if}}
                {{#if traceJsonVisible traceId}}
                  <button type="button" class="btn btn-sm btn-outline-secondary mt-2 hide-ai-content-lab-trace-json" data-trace-id="{{traceId}}">Hide trace data</button>
                  <textarea class="form-control admin-form-monospace mt-2" rows="20" readonly>{{traceJson}}</textarea>
                {{else}}
                  <button type="button" class="btn btn-sm btn-outline-secondary mt-2 show-ai-content-lab-trace-json" data-trace-id="{{traceId}}">Load trace data</button>
                {{/if}}
              </details>
            {{/each}}
          </section>

          <div class="admin-form-row-top">
            <button type="button" class="btn btn-sm btn-outline-secondary snapshot-ai-content-prompt-lab-run">
              {{#if hasRunObjectSnapshot}}Refresh{{else}}Load{{/if}} complete run-object snapshot
            </button>
            <div class="form-text">The snapshot is generated only on request and does not refresh while the pipeline is running.</div>
          </div>
          {{#if hasRunObjectSnapshot}}
            <label for="ai-content-prompt-lab-run-object" class="form-label admin-form-row-top">Complete pipeline run object snapshot</label>
            <textarea id="ai-content-prompt-lab-run-object" class="form-control admin-form-monospace ai-content-lab-json" rows="24" readonly>{{runObjectSnapshot}}</textarea>
          {{/if}}

          <section class="ai-review admin-form-row-top" aria-labelledby="ai-content-prompt-lab-review-title">
            <h3 id="ai-content-prompt-lab-review-title">Creator review preview</h3>
            {{#if hasWarnings}}
              <div class="alert alert-warning ai-review-warnings" role="status">
                {{#each warnings}}<div>{{this}}</div>{{/each}}
              </div>
            {{/if}}
            {{> aiContentReviewPairs pairs=reviewPairs}}
          </section>
        {{/if}}
      </div>
    </div>
  </div>
</template>
